# Compila el APK de Android y lo publica en la página de Releases del repositorio.
name: APK Android

on:
  push:
    branches: [main]
    paths-ignore: ['servidor/**', '**.md']
  pull_request:
    paths-ignore: ['servidor/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Revisar la firma
        # Las versiones que se publican deben llevar la firma oficial; sin ella no
        # se instalarían encima de la app que ya está en el Xiaomi.
        if: github.event_name != 'pull_request'
        env:
          MARLES_FIRMA: ${{ secrets.MARLES_FIRMA }}
        run: |
          if [ -z "$MARLES_FIRMA" ]; then
            echo "::error::Falta el secreto MARLES_FIRMA. Sigue el paso 'Firma del APK' del README."
            exit 1
          fi
      - run: flutter pub get
      - run: flutter analyze
      # Pruebas de punta a punta: ffmpeg arma el video final igual que en el
      # celular, y la app sube de verdad al servidor (el mismo código que corre
      # en Cloudflare, levantado aquí con un almacenamiento de prueba).
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - name: Levantar el servidor de prueba
        working-directory: servidor
        run: |
          npm ci
          nohup node herramientas/servir.mjs > servidor.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -H 'Authorization: Bearer clave-de-prueba-local' http://127.0.0.1:8787/api/ping > /dev/null && exit 0
            sleep 1
          done
          echo "::error::El servidor de prueba no arrancó"
          cat servidor.log
          exit 1
      - run: flutter test
        env:
          MARLES_E2E_URL: http://127.0.0.1:8787
          MARLES_E2E_CLAVE: clave-de-prueba-local
      - name: Compilar APK
        env:
          MARLES_FIRMA: ${{ secrets.MARLES_FIRMA }}
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk marles360-v${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: marles360-apk
          path: marles360-v${{ github.run_number }}.apk
      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Marles 360 versión ${{ github.run_number }}
          body: Abre este enlace desde el Xiaomi y toca el archivo .apk para instalarlo.
          files: marles360-v${{ github.run_number }}.apk
