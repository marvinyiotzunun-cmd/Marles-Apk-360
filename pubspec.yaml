name: marles360
description: "Marles APK 360: graba videos del Photo Booth 360 con marco y canción, y los entrega por QR."
publish_to: 'none'

# La versión que ve Android. El número de compilación lo pone GitHub Actions.
version: 1.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.7
  qr_flutter: ^4.1.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  wakelock_plus: ^1.8.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Para simular la cámara y el reproductor en las pruebas de pantallas.
  camera_platform_interface: ^2.15.0
  video_player_platform_interface: ^6.9.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
