# Reglas del analizador. GitHub Actions falla si aparece cualquier aviso.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

formatter:
  page_width: 120

linter:
  rules:
    # Un Future sin await que falla en silencio es un error difícil de ver.
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_final_locals: true
    always_declare_return_types: true
